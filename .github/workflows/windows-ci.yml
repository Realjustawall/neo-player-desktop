name: Windows Cleanroom CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cleanroom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-run:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PROJECT: src/NeoPlayer.Windows/NeoPlayer.Windows.csproj
      PUBLISH_DIR: artifacts/neo-win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify .NET 8 SDK
        shell: pwsh
        run: |
          dotnet --version
          if (-not ((dotnet --version).StartsWith('8.'))) { throw 'The pinned global.json did not select .NET 8.' }
      - name: Restore
        shell: pwsh
        run: dotnet restore NeoPlayer.Desktop.sln -r win-x64
      - name: Unit tests
        shell: pwsh
        run: dotnet test tests/NeoPlayer.Tests/NeoPlayer.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx"
      - name: Build
        shell: pwsh
        run: dotnet build $env:PROJECT -c Release --no-restore -p:ContinuousIntegrationBuild=true -warnaserror
      - name: Publish compact self-contained
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true --no-restore -o $env:PUBLISH_DIR -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:ContinuousIntegrationBuild=true
      - name: Runtime self-test
        shell: pwsh
        run: |
          $env:NEO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'neo-self-test'
          $process = Start-Process -FilePath "$env:PUBLISH_DIR/NEO Player.exe" -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)" }
      - name: WPF UI smoke test
        shell: pwsh
        run: |
          $env:NEO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'neo-ui-smoke'
          $process = Start-Process -FilePath "$env:PUBLISH_DIR/NEO Player.exe" -ArgumentList '--ui-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "UI smoke test failed with exit code $($process.ExitCode)" }
      - name: Package size gate
        shell: pwsh
        run: |
          $files = Get-ChildItem $env:PUBLISH_DIR -Recurse -File
          $bytes = ($files | Measure-Object Length -Sum).Sum
          $mb = [math]::Round($bytes / 1MB, 2)
          Write-Host "Published size: $mb MB across $($files.Count) files"
          if ($mb -gt 120) { throw "Published package is too large: $mb MB" }
          Compress-Archive -Path "$env:PUBLISH_DIR/*" -DestinationPath artifacts/NEO-Player-Desktop-cleanroom-win-x64.zip -CompressionLevel Optimal
          $zipMb = [math]::Round((Get-Item artifacts/NEO-Player-Desktop-cleanroom-win-x64.zip).Length / 1MB, 2)
          Write-Host "ZIP size: $zipMb MB"
          if ($zipMb -gt 100) { throw "ZIP is too large: $zipMb MB" }
      - name: Upload tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEO-Player-Desktop-cleanroom-win-x64
          path: artifacts/NEO-Player-Desktop-cleanroom-win-x64.zip
          retention-days: 14
