name: Publish v0.1.0-alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v0.1-alpha.yml'

permissions:
  contents: write

jobs:
  release-win-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PROJECT: src/NeoPlayer.Windows/NeoPlayer.Windows.csproj
      PUBLISH_DIR: artifacts/NEO-Player-Desktop-0.1-alpha-win-x64
      TAG: v0.1.0-alpha
      ZIP: NEO-Player-Desktop-0.1-alpha-win-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore win-x64
        run: dotnet restore $env:PROJECT -r win-x64

      - name: Build Release
        run: dotnet build $env:PROJECT -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Publish self-contained win-x64
        run: >-
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true
          --no-restore -o $env:PUBLISH_DIR
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg binaries were not found after extraction.' }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:PUBLISH_DIR 'tools') | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $env:PUBLISH_DIR 'tools/ffmpeg.exe')
          Copy-Item $ffprobe.FullName (Join-Path $env:PUBLISH_DIR 'tools/ffprobe.exe')

      - name: Bundle Vosk English and Persian models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modelRoot = Join-Path $env:PUBLISH_DIR 'assets/models'
          New-Item -ItemType Directory -Force -Path $modelRoot | Out-Null
          $models = @('vosk-model-small-en-us-0.15','vosk-model-small-fa-0.42')
          foreach ($model in $models) {
            $zip = Join-Path $env:RUNNER_TEMP "$model.zip"
            Invoke-WebRequest "https://alphacephei.com/vosk/models/$model.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $modelRoot -Force
          }

      - name: Copy notices
        shell: pwsh
        run: |
          Copy-Item README.md $env:PUBLISH_DIR
          Copy-Item LICENSE $env:PUBLISH_DIR
          Copy-Item THIRD_PARTY_NOTICES.md $env:PUBLISH_DIR

      - name: Smoke-check package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:PUBLISH_DIR 'NEO Player.exe'
          if (-not (Test-Path $exe)) { throw "Missing executable: $exe" }
          if (-not (Test-Path (Join-Path $env:PUBLISH_DIR 'tools/ffmpeg.exe'))) { throw 'Missing bundled FFmpeg.' }
          if (-not (Test-Path (Join-Path $env:PUBLISH_DIR 'tools/ffprobe.exe'))) { throw 'Missing bundled ffprobe.' }
          if (-not (Test-Path (Join-Path $env:PUBLISH_DIR 'assets/models/vosk-model-small-en-us-0.15'))) { throw 'Missing English Vosk model.' }
          if (-not (Test-Path (Join-Path $env:PUBLISH_DIR 'assets/models/vosk-model-small-fa-0.42'))) { throw 'Missing Persian Vosk model.' }

      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:ZIP) { Remove-Item $env:ZIP -Force }
          Compress-Archive -Path (Join-Path $env:PUBLISH_DIR '*') -DestinationPath $env:ZIP -CompressionLevel Optimal
          $hash = (Get-FileHash $env:ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ZIP" | Set-Content "$env:ZIP.sha256" -Encoding ascii
          "ZIP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          # NEO Player Desktop 0.1 Alpha

          First public Windows alpha of NEO Player Desktop.

          Included in this portable self-contained win-x64 package:
          - NEO Player.exe and the .NET desktop runtime
          - FFmpeg and ffprobe
          - Offline Vosk English model
          - Offline Vosk Persian model
          - Windows desktop playback, library, lyrics, EQ/Track+, AutoMix/crossfade, backup, media controls, tray/compact player, and the current Android-parity feature set implemented in this alpha

          Build verification:
          - Release build: 0 errors, 0 warnings
          - Self-contained win-x64 publish: passed
          - Dependency/package smoke-check: passed

          SHA-256 of attached ZIP: $env:ZIP_SHA256

          This is an Alpha/pre-release build. Runtime testing on physical Windows systems is still encouraged for hardware/audio-device-specific behavior.
          "@ | Set-Content release-notes.md -Encoding utf8

      - name: Create GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $env:TAG $env:ZIP "$env:ZIP.sha256" --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:TAG --prerelease --title 'NEO Player Desktop 0.1 Alpha' --notes-file release-notes.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG $env:ZIP "$env:ZIP.sha256" --target $env:GITHUB_SHA --title 'NEO Player Desktop 0.1 Alpha' --notes-file release-notes.md --prerelease --repo $env:GITHUB_REPOSITORY
          }
