name: Remove broken alpha release

on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-old-release.yml]

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove v0.1.0-alpha release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0-alpha --repo "${{ github.repository }}" --cleanup-tag -y || true
