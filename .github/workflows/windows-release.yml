name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build and test Windows release
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Smoke test packaged executable
        shell: pwsh
        run: ./dist-win/NEOPlayer/NEOPlayer.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: NEO-Player-Windows
          path: release/*
          if-no-files-found: error
      - name: Publish versioned release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag release/* --target "${{ github.sha }}" --title "NEO Player $tag" --generate-notes
          } else {
            gh release upload $tag release/* --clobber
          }
